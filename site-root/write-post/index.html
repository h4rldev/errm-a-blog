<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Write Post</title>
  </head>
  <body>
    <main>
      <section>
        <h1>Write Post</h1>
        <form id="create-post-form">
          <p>
            <label for="create-post-title">Title</label>
            <input type="text" id="create-post-title" name="title" placeholder="Title" required>
          </p>
          <p>
            <label for="create-post-slug">Slug (optional)</label>
            <input type="text" id="create-post-slug" name="slug" placeholder="Slug (optional)">
          </p>
          <p>
            <label for="create-post-summary">Summary (optional)</label>
            <input type="text" id="create-post-summary" name="summary" placeholder="Summary (optional)">
          </p>
          <p>
            <label for="create-post-content">Content</label>
            <input type="text" id="create-post-content" name="content_markdown" placeholder="Content" required>
          </p>
          <p>
            <label for="create-post-tags">Tags (optional)</label>
            <input type="text" id="create-post-tags" name="tags" placeholder="Tags (optional)">
          </p>
          <input type="submit" value="Create Post">
        </form>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
